# =========================================================
# config/sources.yaml — TODO el radar se controla desde acá
# v3.8 · fase 3 (patentes): Google News patentes (keyless) +
#        patentsview + lens (se activan con secrets, manual §13).
#        PATENTSCOPE: gateado (SOAP + registro WIPO, ver §10).
# =========================================================

# Email para polite pool de OpenAlex/Crossref (mejora rate limits)
polite_email: "escalandoenlabolsaia@gmail.com"   # ← REEMPLAZAR por tu email real

caps:
  per_source: 50      # máx ítems por fuente por corrida
  total: 300          # máx ítems que llegan al agente
  # Fase 2: cupo propio para las fuentes biosalud (el resto queda en 50)
  # Fase 3: patentes entran al mismo régimen 25
  per_source_override:
    clinicaltrials: 25
    openfda-farmacos: 25
    openfda-510k: 25
    openfda-pma: 25
    patentsview: 25
    lens: 25

threshold: 70         # nota mínima 0-100 para entrar al informe

notify:
  top_n: 5           # ítems que van al push de ntfy
  max_bytes: 4096

openalex:
  days_back: 2        # ventana temporal de la búsqueda
  per_page: 100
  max_pages: 2

arxiv:
  categories:
    - cs.AI
    - cs.LG
    - q-bio.QB
    - q-bio.BM
    - physics.app-ph
  max_results: 100

rss:
  # Un feed nuevo = 1 línea. Cualquier URL caída se loguea y NO rompe la corrida.
  # max_items (opcional) limita las entradas tomadas de un feed pesado.
  feeds:
    - { name: "Nature",           url: "https://www.nature.com/nature.rss",               lang: en }
    - { name: "Science",          url: "https://www.science.org/rss/news_current.xml",    lang: en }
    - { name: "Phys.org",         url: "https://phys.org/rss-feed/",                      lang: en }
    - { name: "Ars Technica",     url: "https://feeds.arstechnica.com/arstechnica/index", lang: en }
    - { name: "MIT Tech Review",  url: "https://www.technologyreview.com/feed/",          lang: en }
    # Fase 2 (biosalud): anuncios oficiales de la OMS (brotes, precalificación
    # de medicamentos, emergencias sanitarias). max_items: el feed trae historia.
    - { name: "WHO News",         url: "https://www.who.int/rss-feeds/news-english.xml",  lang: en, max_items: 12 }
    # Fase 3 (patentes): Google News RSS = la única vía keyless viva para
    # patentes hoy (sondeo 10: 66 ítems en / 12 es en 3 días). Query
    # refinada sin ruido vehicular; max_items controla el peso.
    - { name: "Patentes EN",      url: "https://news.google.com/rss/search?q=%22patent%20granted%22%20OR%20%22patent%20issued%22%20OR%20%22patent%20application%22%20OR%20%22patents%22%20when%3A3d&hl=en&gl=US&ceid=US:en", lang: en, max_items: 15 }
    - { name: "Patentes ES",      url: "https://news.google.com/rss/search?q=patente%20concedida%20OR%20%22nueva%20patente%22%20OR%20patenta%20when%3A3d&hl=es&gl=AR&ceid=AR:es", lang: es, max_items: 10 }

# ---------------- FASE 2 (biosalud) ----------------
clinicaltrials:
  days_back: 2              # ventana de estudios actualizados
  phases: [PHASE2, PHASE3]  # fases que interesan ([] = todas)
  max_results: 100          # pageSize del único request por corrida

openfda:
  farmacos:                 # drug/drugsfda — aprobaciones ORIG (AP)
    days_back: 15           # el dataset tiene ~1 semana de lag de
    limit: 100              # publicación (verificado 17/10: corte ~9-12/10)
  dispositivos_510k:        # device/510k — autorizaciones 510(k)
    days_back: 35           # el dataset carga ~1x/mes: ventana ancha,
    limit: 100              # la dedup hace que cada decisión entre 1 vez
  dispositivos_pma:         # device/pma — aprobaciones PMA
    days_back: 35
    limit: 100

# ---------------- FASE 3 (patentes / inventos) ----------------
# patentsview y lens NO hacen requests hasta que existan sus secrets
# (PATENTSVIEW_API_KEY / LENS_API_TOKEN): sin secret = skip silencioso.
patentsview:                # USPTO — concesiones (API nuevo, X-Api-Key)
  days_back: 7              # el USPTO concede los martes: ventana semanal
  max_results: 100
  # enabled: false           # válvula de emergencia (como openfda)

lens:                       # 100+ jurisdicciones — publicación global
  days_back: 7              # las oficinas publican en olas semanales
  max_results: 100
  # enabled: false

agent:
  # Vacío = auto-descubre el mejor modelo disponible en cada corrida.
  # Solo llenar si algún día querés fijar un modelo a mano.
  groq_model: ""
  github_model: ""
