# =========================================================
# config/sources.yaml — TODO el radar se controla desde acá
# v3.9 · fase 3 (patentes): Google News patentes (keyless, en
#        producción) + patentsview + lens + epo_ops (los tres se
#        activan con secrets, manual §13; lens descartada sin mail
#        académico y patentsview congelada por la migración ODP).
#        PATENTSCOPE: sin API pública (verificado, §10).
# v3.10 · fase 4 (financiamiento/predicción): NIH RePORTER keyless
#        (sin secret). Los proyectos con fecha de inicio FUTURA son
#        SEÑAL DE ANTICIPACIÓN, no ruido: el radar los prioriza.
# =========================================================

# Email para polite pool de OpenAlex/Crossref (mejora rate limits)
polite_email: "escalandoenlabolsaia@gmail.com"   # ← REEMPLAZAR por tu email real

caps:
  per_source: 50      # máx ítems por fuente por corrida
  total: 300          # máx ítems que llegan al agente
  # Fase 2: cupo propio para las fuentes biosalud (el resto queda en 50)
  # Fase 3: patentes entran al mismo régimen 25
  # Fase 4: financiamiento entra al mismo régimen 25
  per_source_override:
    clinicaltrials: 25
    openfda-farmacos: 25
    openfda-510k: 25
    openfda-pma: 25
    patentsview: 25
    lens: 25
    epo_ops: 25
    nih_reporter: 25

threshold: 70         # nota mínima 0-100 para entrar al informe

notify:
  top_n: 5           # ítems que van al push de ntfy
  max_bytes: 4096

openalex:
  days_back: 2        # ventana temporal de la búsqueda
  per_page: 100
  max_pages: 2

arxiv:
  categories:
    - cs.AI
    - cs.LG
    - q-bio.QB
    - q-bio.BM
    - physics.app-ph
  max_results: 100

rss:
  # Un feed nuevo = 1 línea. Cualquier URL caída se loguea y NO rompe la corrida.
  # max_items (opcional) limita las entradas tomadas de un feed pesado.
  feeds:
    - { name: "Nature",           url: "https://www.nature.com/nature.rss",               lang: en }
    - { name: "Science",          url: "https://www.science.org/rss/news_current.xml",    lang: en }
    - { name: "Phys.org",         url: "https://phys.org/rss-feed/",                      lang: en }
    - { name: "Ars Technica",     url: "https://feeds.arstechnica.com/arstechnica/index", lang: en }
    - { name: "MIT Tech Review",  url: "https://www.technologyreview.com/feed/",          lang: en }
    # Fase 2 (biosalud): anuncios oficiales de la OMS (brotes, precalificación
    # de medicamentos, emergencias sanitarias). max_items: el feed trae historia.
    - { name: "WHO News",         url: "https://www.who.int/rss-feeds/news-english.xml",  lang: en, max_items: 12 }
    # Fase 3 (patentes): Google News RSS = la columna vertebral keyless en
    # producción (corrida 13: 15 + 10 ítems reales). Query refinada sin
    # ruido vehicular; max_items controla el peso.
    - { name: "Patentes EN",      url: "https://news.google.com/rss/search?q=%22patent%20granted%22%20OR%20%22patent%20issued%22%20OR%20%22patent%20application%22%20OR%20%22patents%22%20when%3A3d&hl=en&gl=US&ceid=US:en", lang: en, max_items: 15 }
    - { name: "Patentes ES",      url: "https://news.google.com/rss/search?q=patente%20concedida%20OR%20%22nueva%20patente%22%20OR%20patenta%20when%3A3d&hl=es&gl=AR&ceid=AR:es", lang: es, max_items: 10 }

# ---------------- FASE 2 (biosalud) ----------------
clinicaltrials:
  days_back: 2              # ventana de estudios actualizados
  phases: [PHASE2, PHASE3]  # fases que interesan ([] = todas)
  max_results: 100          # pageSize del único request por corrida

openfda:
  farmacos:                 # drug/drugsfda — aprobaciones ORIG (AP)
    days_back: 15           # el dataset tiene ~1 semana de lag de
    limit: 100              # publicación (verificado 17/10: corte ~9-12/10)
  dispositivos_510k:        # device/510k — autorizaciones 510(k)
    days_back: 35           # el dataset carga ~1x/mes: ventana ancha,
    limit: 100              # la dedup hace que cada decisión entre 1 vez
  dispositivos_pma:         # device/pma — aprobaciones PMA
    days_back: 35
    limit: 100

# ---------------- FASE 3 (patentes / inventos) ----------------
# patentsview, lens y epo_ops NO hacen requests hasta que existan sus
# secrets (PATENTSVIEW_API_KEY / LENS_API_TOKEN / OPS_CONSUMER_KEY +
# OPS_CONSUMER_SECRET): sin secret = skip silencioso.
patentsview:                # USPTO — CONGELADA: el portal de keys está
  days_back: 7              # cerrado por la migración al Open Data Portal
  max_results: 100          # (sin ETA, ver §10); el fetcher queda dormido
  # enabled: false          # y se recalibra cuando USPTO rearme su API

lens:                       # DESCARTADA sin mail académico: la gratuita
  days_back: 7              # permanente exige cuenta Académica (verificado
  max_results: 100          # en el registro 17/10); queda dormida por si
  # enabled: false          # algún día cambia el acceso

epo_ops:                    # EPO OPS — publicaciones EP + WO (PCT): el
  days_back: 7              # pipeline internacional de invención. EP y WO
  max_results: 100          # publican en días fijos de la semana (EP ~mié,
  # enabled: false          # WO ~jue): ventana de 7 días para que toda
                            # corrida los pesque. 2 requests/corrida:
                            # sondeo + página aleatoria dentro del techo
                            # de 2000 registros de la EPO (§10).

# ---------------- FASE 4 (financiamiento / predicción) ----------------
# NIH RePORTER: keyless (sin secret, patrón OpenAlex). POST-only.
# Los proyectos con project_start_date FUTURA son SEÑAL DE ANTICIPACIÓN:
# el radar los quiere ver meses antes de que arranquen, no los filtra.
# Trampas confirmadas en sondeos (2026-10-21):
#   · Pedido en PascalCase, respuesta en snake_case.
#   · sort_field=project_start_date respeta el orden (desc = más nuevo).
#   · fiscal_year 2027 = proyectos que arrancan desde 2026-10-01.
#   · award_amount puede venir null (tolerado).
nih_reporter:
  fiscal_years: [2026, 2027]  # año fiscal actual + siguiente (futuros)
  max_results: 100             # pageSize del único request por corrida
  # enabled: false             # válvula de emergencia (patrón fase 3)

agent:
  # Vacío = auto-descubre el mejor modelo disponible en cada corrida.
  # Solo llenar si algún día querés fijar un modelo a mano.
  groq_model: ""
  github_model: ""
